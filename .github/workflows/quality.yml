name: Manual quality and offline runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Evaluate declared platforms and check Nix/direnv configuration
        run: |
          nix flake check --all-systems --no-build
          nix flake check
      - name: Verify the Python development shell
        run: |
          nix develop --command bash -eu <<'BASH'
          python3 --version
          uv --version
          bash -n tools/worktree
          shellcheck tools/worktree
          bash -n tools/dev
          shellcheck tools/dev
          test "$UV_PYTHON_DOWNLOADS" = never
          test "$UV_PROJECT_ENVIRONMENT" = "$PWD/.venv"
          BASH
      - name: Provision Python and verify the real Linux isolation boundary
        run: |
          nix develop --command uv sync --locked
          nix develop --command unshare --user --map-root-user --net bash -eu <<'BASH'
          ip link set lo up
          .venv/bin/pytest -m 'not android' --cov=src/gramlab --cov-report=term-missing --cov-fail-under=80
          BASH

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.13"
      - name: Provision locked development tools
        run: uv sync --locked
      - name: Validate configuration and local Markdown links
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          import re
          import tomllib
          root = Path.cwd()
          for name in ("pyproject.toml", "uv.lock"):
              with (root / name).open("rb") as stream:
                  tomllib.load(stream)
          files = [root / name for name in
                   ("README.md", "AGENTS.md", "CONTEXT.md", "TESTING.md", "CONTRIBUTING.md")]
          for directory in ("docs", ".scratch", "clients", "tests", "examples", "src"):
              files.extend(p for p in (root / directory).rglob("*.md")
                           if "upstream" not in p.relative_to(root).parts)
          errors = []
          for path in files:
              body = path.read_text(encoding="utf-8")
              for target in re.findall(r"\[[^\]]*\]\(([^)]+)\)", body):
                  if "://" in target or target.startswith("#"):
                      continue
                  target = target.split("#", 1)[0]
                  if target and not (path.parent / target).exists():
                      errors.append(f"{path.relative_to(root)}: {target}")
          if errors:
              raise SystemExit("Broken local links:\n" + "\n".join(errors))
          print(f"Validated configuration and links in {len(files)} Markdown files.")
          PY
      - name: Guest startup diagnostics typing
        run: MYPYPATH=tests uv run --locked mypy --explicit-package-bases tests/probes/android_guest.py tests/test_guest_startup_diagnostics.py
      - name: Real bot media scenario typing
        run: |
          uv run --locked mypy tests/fixtures/media_bot.py tests/probes/media_round_trip.py tests/test_media_round_trip.py
          uv run --locked mypy tests/probes/android_media.py tests/test_android_media.py
          MYPYPATH=tests uv run --locked mypy --strict --explicit-package-bases tests/probes/native_asset_proxy.py tests/test_native_asset_proxy.py
          uv run --locked mypy tests/probes/android_media_codec.py tests/test_android_media_codec.py
          uv run --locked mypy tests/probes/android_media_faults.py tests/test_android_media_faults.py
          uv run --locked mypy tests/probes/android_media_interactions.py tests/test_android_media_interactions.py
          uv run --locked mypy tests/probes/android_rich_media_late.py tests/test_android_rich_media_late.py
          uv run --locked mypy --strict tests/test_rich_mentions.py tests/test_rich_mentions_api.py tests/test_rich_mentions_bridge.py
          uv run --locked mypy tests/probes/android_rich_mentions_codec.py tests/test_android_rich_mentions_codec.py
          uv run --locked mypy tests/fixtures/rich_mentions_bot.py tests/probes/rich_mentions_round_trip.py tests/probes/android_rich_mentions.py tests/test_rich_mentions_round_trip.py tests/test_android_rich_mentions.py
      - name: Custom emoji catalog and native codec typing
        run: |
          uv run --locked mypy --strict tests/test_custom_emoji_media.py tests/test_custom_emoji_world.py tests/test_custom_emoji_api.py tests/test_custom_emoji_bridge.py tests/test_custom_emoji_text.py tests/test_custom_emoji_scenario.py tests/test_emoji_runtime_selection.py tests/test_custom_emoji_isolation.py tests/test_runner_custom_emoji_registration.py
          uv run --locked mypy tests/probes/android_custom_emoji_codec.py tests/test_android_custom_emoji_codec.py
          uv run --locked mypy --strict tests/probes/android_custom_emoji.py tests/test_android_custom_emoji.py tests/custom_emoji_visual.py tests/test_custom_emoji_visual.py
          uv run --locked mypy --strict tests/fixtures/custom_emoji_bot.py tests/probes/custom_emoji_round_trip.py tests/test_custom_emoji_round_trip.py
      - name: Public media capture typing
        run: uv run --locked mypy tests/test_runner_media_captures.py
      - name: Media transfer fault fixture typing
        run: MYPYPATH=tests uv run --locked mypy --explicit-package-bases tests/probes/media_transfer_server.py tests/test_media_transfer_server.py
      - name: Explicit rich button input experiment typing
        run: uv run --locked mypy tests/probes/android_rich_messages.py tests/probes/android_rich_action_input.py tests/probes/rich_action_input_round_trip.py tests/fixtures/rich_action_input_bot.py tests/rich_action_input_experiment.py
      - name: Rich button rendering typing
        run: uv run --locked mypy tests/test_rich_action_round_trip.py tests/test_android_rich_actions.py tests/probes/android_rich_actions.py
      - name: Rich button codec and capture typing
        run: uv run --locked mypy tests/probes/android_rich_button_codec.py tests/test_android_rich_button_codec.py tests/test_runner_rich_action_captures.py
      - name: Lint and formatting
        run: |
          uv run --locked ruff check . tools/test-timings tools/worktree-dependency
          uv run --locked ruff format --check . tools/test-timings tools/worktree-dependency
      - name: Strict Python type checking
        run: >-
          uv run --locked mypy src/gramlab tests/probes/android_guest.py tests/probes/android_native_guard.py
          tests/probes/android_client_bridge.py tests/probes/android_application.py tests/probes/android_callbacks.py
          tests/probes/android_formatting.py tests/probes/formatted_round_trip.py tests/fixtures/formatted_bot.py
          tests/probes/android_recovery.py tests/probes/recovery_round_trip.py tests/fixtures/recovery_bot.py
          tests/probes/android_composer.py tests/probes/android_live_gap.py tests/probes/android_composer_text.py tests/probes/jdwp.py tests/composer_report.py
          tests/probes/component_bot.py tests/probes/emulator_process.py
          tests/probes/long_poll_bot.py
          tests/probes/bot_round_trip.py tests/probes/callback_round_trip.py tests/fixtures/echo_bot.py tests/fixtures/callback_bot.py clients/android/prepare.py
          tests/recovery_report.py examples/report.py
          tests/probes/scenario_round_trip.py tests/fixtures/scenario_actor.py examples/echo
          tests/probes/trace_runner.py
      - name: Type check the rich-message scenario and Android probes
        run: uv run --locked mypy tests/probes/rich_round_trip.py tests/probes/android_rich_messages.py tests/fixtures/rich_bot.py tests/test_rich_round_trip.py tests/test_android_rich_messages.py
      - name: Type check the native list probes
        run: uv run --locked mypy tests/probes/android_rich_lists.py tests/test_android_rich_lists.py tests/probes/android_list_rendering.py tests/test_android_list_rendering.py
      - name: Type check rich-text normalization acceptance
        run: uv run --locked mypy tests/test_rich_cleaning_round_trip.py tests/test_android_rich_cleaning.py tests/probes/android_rich_cleaning.py
      - name: Type check the independent inline consumer example
        run: uv run --locked mypy examples/inline
      - name: Type check the independent recovery consumer example
        run: uv run --locked mypy examples/recovery
      - name: Type check the independent composer consumer example
        run: uv run --locked mypy examples/composer
      - name: Type check the explicit copy and disabled experiment
        run: uv run --locked mypy tests/probes/android_rich_action_effect.py tests/rich_action_effect_experiment.py tests/probes/rich_action_effect_round_trip.py tests/fixtures/rich_action_effect_bot.py
      - name: Type check the independent rich-message consumer example
        run: uv run --locked mypy examples/rich tests/test_runner_rich_example.py
      - name: Type check the original effects observation
        run: uv run --locked mypy tests/probes/android_effects.py tests/test_android_effects.py
      - name: Type check the independent rich inline consumer example
        run: uv run --locked mypy examples/rich_inline tests/test_runner_rich_buttons.py
      - name: Type check the independent rich-list consumer example
        run: uv run --locked mypy examples/rich_lists tests/test_runner_rich_lists.py
      - name: Type check deterministic media fixture tooling
        run: uv run --locked mypy --strict tests/assets/rich-media/generate.py tests/assets/rich-media/verify.py tests/assets/rich-media/jpeg_generate.py tests/assets/rich-media/jpeg_verify.py
      - name: Type check custom emoji fixture tooling
        run: uv run --locked mypy --strict tests/assets/custom-emoji/generate.py tests/assets/custom-emoji/verify.py tests/assets/custom-emoji/toolchain.py
      - name: Type check quoted-code acceptance
        run: uv run --locked mypy tests/test_quoted_code_entities.py tests/test_quoted_code_round_trip.py tests/test_android_quoted_code.py tests/probes/quoted_code_round_trip.py tests/probes/android_quoted_code.py tests/probes/android_quoted_code_codec.py tests/probes/rich_round_trip.py tests/fixtures/quoted_code_bot.py
      - name: Type-check independent polling startup scenario
        run: uv run --locked mypy tests/test_polling_startup_round_trip.py tests/probes/polling_startup_round_trip.py tests/fixtures/polling_startup_bot.py
      - name: Type check the retained timing command
        run: uv run --locked mypy tools/test-timings tests/test_test_timings.py
      - name: Type check frozen worktree dependency tool
        run: uv run --locked mypy --strict tools/worktree-dependency tests/test_worktree_dependency.py
      - name: Type check rich-link acceptance
        run: uv run --locked mypy tests/test_rich_links_round_trip.py tests/test_android_rich_links.py tests/test_runner_rich_link_captures.py tests/probes/rich_links_round_trip.py tests/probes/android_rich_links.py tests/probes/android_message_codec.py
