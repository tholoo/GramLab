name: Manual quality and offline runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Evaluate declared platforms and check Nix/direnv configuration
        run: |
          nix flake check --all-systems --no-build
          nix flake check
      - name: Verify the Python development shell
        run: |
          nix develop --command bash -eu <<'BASH'
          python3 --version
          uv --version
          bash -n tools/worktree
          shellcheck tools/worktree
          bash -n tools/dev
          shellcheck tools/dev
          test "$UV_PYTHON_DOWNLOADS" = never
          test "$UV_PROJECT_ENVIRONMENT" = "$PWD/.venv"
          BASH
      - name: Provision Python and verify the real Linux isolation boundary
        run: |
          nix develop --command uv sync --locked
          nix develop --command unshare --user --map-root-user --net bash -eu <<'BASH'
          ip link set lo up
          .venv/bin/pytest -m 'not android' --cov=src/gramlab --cov-report=term-missing --cov-fail-under=80
          BASH

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.5"
          python-version: "3.13"
      - name: Provision locked development tools
        run: uv sync --locked
      - name: Validate configuration and local Markdown links
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          import re
          import tomllib
          root = Path.cwd()
          for name in ("pyproject.toml", "uv.lock"):
              with (root / name).open("rb") as stream:
                  tomllib.load(stream)
          files = [root / name for name in
                   ("README.md", "AGENTS.md", "CONTEXT.md", "TESTING.md", "CONTRIBUTING.md")]
          for directory in ("docs", ".scratch", "clients", "tests", "examples", "src"):
              files.extend(p for p in (root / directory).rglob("*.md")
                           if "upstream" not in p.relative_to(root).parts)
          errors = []
          for path in files:
              body = path.read_text(encoding="utf-8")
              for target in re.findall(r"\[[^\]]*\]\(([^)]+)\)", body):
                  if "://" in target or target.startswith("#"):
                      continue
                  target = target.split("#", 1)[0]
                  if target and not (path.parent / target).exists():
                      errors.append(f"{path.relative_to(root)}: {target}")
          if errors:
              raise SystemExit("Broken local links:\n" + "\n".join(errors))
          print(f"Validated configuration and links in {len(files)} Markdown files.")
          PY
      - name: Rich button rendering typing
        run: uv run --locked mypy tests/test_rich_action_round_trip.py tests/test_android_rich_actions.py tests/probes/android_rich_actions.py
      - name: Rich button codec and capture typing
        run: uv run --locked mypy tests/probes/android_rich_button_codec.py tests/test_android_rich_button_codec.py tests/test_runner_rich_action_captures.py
      - name: Lint and formatting
        run: |
          uv run --locked ruff check . tools/test-timings
          uv run --locked ruff format --check . tools/test-timings
      - name: Strict Python type checking
        run: >-
          uv run --locked mypy src/gramlab tests/probes/android_guest.py tests/probes/android_native_guard.py
          tests/probes/android_client_bridge.py tests/probes/android_application.py tests/probes/android_callbacks.py
          tests/probes/android_formatting.py tests/probes/formatted_round_trip.py tests/fixtures/formatted_bot.py
          tests/probes/android_recovery.py tests/probes/recovery_round_trip.py tests/fixtures/recovery_bot.py
          tests/probes/android_composer.py tests/probes/android_live_gap.py tests/probes/android_composer_text.py tests/probes/jdwp.py tests/composer_report.py
          tests/probes/component_bot.py tests/probes/emulator_process.py
          tests/probes/long_poll_bot.py
          tests/probes/bot_round_trip.py tests/probes/callback_round_trip.py tests/fixtures/echo_bot.py tests/fixtures/callback_bot.py clients/android/prepare.py
          tests/recovery_report.py examples/report.py
          tests/probes/scenario_round_trip.py tests/fixtures/scenario_actor.py examples/echo
          tests/probes/trace_runner.py
      - name: Type check the rich-message scenario and Android probes
        run: uv run --locked mypy tests/probes/rich_round_trip.py tests/probes/android_rich_messages.py tests/fixtures/rich_bot.py tests/test_rich_round_trip.py tests/test_android_rich_messages.py
      - name: Type check the native list probes
        run: uv run --locked mypy tests/probes/android_rich_lists.py tests/test_android_rich_lists.py tests/probes/android_list_rendering.py tests/test_android_list_rendering.py
      - name: Type check rich-text normalization acceptance
        run: uv run --locked mypy tests/test_rich_cleaning_round_trip.py tests/test_android_rich_cleaning.py tests/probes/android_rich_cleaning.py
      - name: Type check the independent inline consumer example
        run: uv run --locked mypy examples/inline
      - name: Type check the independent recovery consumer example
        run: uv run --locked mypy examples/recovery
      - name: Type check the independent composer consumer example
        run: uv run --locked mypy examples/composer
      - name: Type check the independent rich-message consumer example
        run: uv run --locked mypy examples/rich tests/test_runner_rich_example.py
      - name: Type check the original effects observation
        run: uv run --locked mypy tests/probes/android_effects.py tests/test_android_effects.py
      - name: Type check the independent rich inline consumer example
        run: uv run --locked mypy examples/rich_inline tests/test_runner_rich_buttons.py
      - name: Type check the independent rich-list consumer example
        run: uv run --locked mypy examples/rich_lists tests/test_runner_rich_lists.py
      - name: Type check the retained timing command
        run: uv run --locked mypy tools/test-timings tests/test_test_timings.py
